<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">T0 watchdog and bypass control loop</title>
  <desc id="desc">U47 keep-alive passes through the U43 cut switch and charge pump to produce sel. Sel passes through R101 to U46. U43 can simulate a hang and U44 with R95 can force watchdog defeat.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1565c0"/></marker>
    <style>
      .bg{fill:#fff}.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.branch{fill:#ecfeff;stroke:#0e7490;stroke-width:2}.flow{fill:none;stroke:#1565c0;stroke-width:3;marker-end:url(#arrow)}.wire{fill:none;stroke:#1565c0;stroke-width:3}.test{fill:none;stroke:#0e7490;stroke-width:3}.control{fill:none;stroke:#7e22ce;stroke-width:2.5;stroke-dasharray:7 5}.txt{font:18px sans-serif;fill:#0f172a;text-anchor:middle}.small{font:15px sans-serif;fill:#334155;text-anchor:middle}.label{font:18px sans-serif;fill:#0f172a}.caption{font:16px sans-serif;fill:#475569}.net{font:italic 16px sans-serif;fill:#1565c0}.ctl{font:15px sans-serif;fill:#7e22ce;text-anchor:middle}
    </style>
  </defs>
  <rect class="bg" width="1200" height="400"/>
  <text class="label" x="30" y="28">Watchdog and bypass — a local control loop</text>
  <rect class="box" x="35" y="75" width="170" height="85" rx="8"/>
  <text class="txt" x="120" y="108">U47 · PD3</text><text class="small" x="120" y="136">20 kHz keep-alive</text>
  <path class="flow" d="M205 118 H265"/>
  <rect class="box" x="265" y="75" width="160" height="85" rx="8"/>
  <text class="txt" x="345" y="108">U43 · KA cut</text><text class="small" x="345" y="136">0 = connected</text>
  <path class="flow" d="M425 118 H490"/>
  <rect class="box" x="490" y="65" width="260" height="105" rx="8"/>
  <text class="txt" x="620" y="96">R109 + C32 + D5</text>
  <text class="small" x="620" y="124">edge-sensitive charge pump</text>
  <text class="small" x="620" y="149">C33 + R108 set decay</text>
  <path class="flow" d="M750 118 H820"/>
  <rect class="box" x="820" y="80" width="125" height="75" rx="8"/>
  <text class="txt" x="882" y="109">R101</text><text class="small" x="882" y="135">0 Ω</text>
  <path class="flow" d="M945 118 H1020"/>
  <rect class="box" x="1020" y="75" width="145" height="85" rx="8"/>
  <text class="txt" x="1092" y="108">U46 · S</text><text class="small" x="1092" y="136">bypass / node TX</text>
  <text class="net" x="770" y="99">sel</text>
  <path class="control" d="M345 66 V75"/><text class="ctl" x="345" y="60">KA_CUT</text>
  <path class="test" d="M345 160 V245"/>
  <rect class="branch" x="265" y="245" width="160" height="65" rx="8"/>
  <text class="txt" x="345" y="273">R93 → GND</text><text class="small" x="345" y="296">park cut input low</text>
  <circle cx="785" cy="118" r="5" fill="#0e7490"/>
  <path class="test" d="M785 118 V245"/>
  <rect class="branch" x="665" y="245" width="240" height="70" rx="8"/>
  <text class="txt" x="785" y="274">U44 + R95 → 3V3</text><text class="small" x="785" y="299">force sel high through 470 Ω</text>
  <path class="control" d="M785 345 V365"/><text class="ctl" x="785" y="389">WD_DEFEAT</text>
  <text class="caption" x="30" y="365">Place the pump, sel branch, and R101 close to U46’s select input.</text>
</svg>
