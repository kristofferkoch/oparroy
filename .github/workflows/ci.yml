# CI: every gate the repo has, run inside the nix dev shell (flake.nix,
# DESIGN.md §8) so CI exercises byte-identical tools to a laptop.
#
# The shell closure comes from the `oparroy` Cachix cache — klee is
# marked broken in nixpkgs and absent from cache.nixos.org, so without
# the cache every run would rebuild LLVM+KLEE from source. Setup:
#   1. Create a public cache named `oparroy` at app.cachix.org.
#   2. Create a cache auth token there and add it to this repo as the
#      Actions secret CACHIX_AUTH_TOKEN (Settings → Secrets → Actions).
# Fork PRs see no secret: they pull from the cache but never push.
#
# The gates run as parallel jobs — none of them consumes another's
# output, so wall-clock is the slowest job, not their sum. Each job
# (and each `sim` matrix leg) pays the fixed install-nix + cache-pull
# cost (~a minute, warm cache). The `check` job only aggregates:
# branch protection and .mergify.yml both require the single context
# `check`, so it fails when any need fails and stays green otherwise.
# Intra-job parallelism is already maximal: ninja/meson drive
# klee-proofs, fuzz, and the unit tests across all cores; the ngspice
# benches are too slow for that to matter, so they fan out as the
# `sim` matrix instead.
#
# Gates are conditional on their declared inputs (see `changes`): a
# PR that touches none of a gate's inputs skips it, and `check`
# counts skipped as green. Push runs on main ignore the filters and
# run everything, so a wrong filter can never leave the merged result
# unvalidated. The declaration is enforced, not just consulted: each
# gate sparse-checks-out only its own inputs, so a dependency the
# filter doesn't declare fails the gate instead of silently passing.
# Rehearse a gate's sparse set locally with `scripts/check-sparse
# <gate>` before pushing filter edits — it parses the sparse-checkout
# blocks below and runs the gate's commands in a sparse worktree, so
# the run steps here and the script's defaults must stay in sync.
# lint has no filter — it checks every file type and is cheap — so a
# change that matches nothing else (docs, boards/lib, the root
# markdown) still gets linted, and lint keeps a full checkout.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Change detection for the conditional gates: each filter below is
  # one gate's declared inputs, and the gate runs only when a PR
  # touches a match. The shared prefix (this workflow, the flake and
  # its nix/ modules) is in every filter — a CI or toolchain change
  # revalidates everything; keep the prefix lines identical across filters.
  changes:
    runs-on: ubuntu-latest
    outputs:
      pytest: ${{ steps.filter.outputs.pytest }}
      firmware: ${{ steps.filter.outputs.firmware }}
      sim: ${{ steps.filter.outputs.sim }}
      rv32ec: ${{ steps.filter.outputs.rv32ec }}
      reproducibility: ${{ steps.filter.outputs.reproducibility }}
    steps:
      # fetch-depth 0: on push events paths-filter diffs against the
      # pre-push HEAD in the local clone (PRs go through the API).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pytest:
              - '.github/workflows/ci.yml'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'src/**'
              - 'tests/**'
              - 'design/**'
              # test_dsl_spice.py copies circuits/lib and runs the
              # watchdog-chargepump bench; test_dsl_spice.py and
              # test_status_leds.py drive benches via scripts/sim-run;
              # test_check_sparse.py drives scripts/check-sparse;
              # test_node_pins.py reads the committed firmware copy;
              # test_dsl_layout_check.py parses the node board;
              # test_dsl_parts_db.py asserts datasheet dirs exist.
              - 'circuits/**'
              - 'scripts/sim-run'
              - 'scripts/check-sparse'
              - 'firmware/node/pins.hpp'
              - 'boards/node/**'
              - 'datasheets/**'
            firmware:
              - '.github/workflows/ci.yml'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'design/__init__.py'
              - 'design/node_pins.py'
              - 'src/**'
              - 'firmware/**'
              - 'meson.build'
              - 'meson.options'
              - 'meson/**'
              - 'scripts/klee-prove'
              - 'scripts/fuzz-run'
            sim:
              - '.github/workflows/ci.yml'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'circuits/**'
              - 'meson.build'
              - 'meson.options'
              - 'meson/**'
              - 'scripts/sim-run'
            rv32ec:
              - '.github/workflows/ci.yml'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'design/__init__.py'
              - 'design/node_pins.py'
              - 'src/**'
              - 'firmware/**'
              - 'meson.build'
              - 'meson.options'
              - 'meson/**'
            reproducibility:
              - '.github/workflows/ci.yml'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'design/__init__.py'
              - 'design/node_pins.py'
              - 'src/**'
              - 'firmware/**'
              - 'meson.build'
              - 'meson.options'
              - 'meson/**'
              - 'scripts/check-reproducible'

  # Python side (uv's lane): DSL unit tests + doctests. The shell
  # hook exports OPARROY_KICAD_* so the KiCad-library tests run.
  pytest:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.pytest == 'true'
    runs-on: ubuntu-latest
    steps:
      # Sparse checkout: only this gate's declared inputs are present,
      # so a dependency the changes filter doesn't know about fails
      # here instead of silently passing. Mirror of the filter
      # (non-cone mode: root files need explicit entries; uv needs
      # README.md via pyproject's readme field; test_check_sparse.py
      # parses ci.yml itself). Keep the block shape
      # (`sparse-checkout: |` at 10 spaces, patterns at 12) —
      # scripts/check-sparse parses it for local rehearsal.
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/ci.yml
            flake.nix
            flake.lock
            nix/**
            README.md
            pyproject.toml
            uv.lock
            .python-version
            src/**
            tests/**
            design/**
            circuits/**
            scripts/sim-run
            scripts/check-sparse
            firmware/node/pins.hpp
            boards/node/**
            datasheets/**

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v16
        with:
          name: oparroy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix develop -c sh -c 'uv sync --frozen && uv run --frozen pytest'

  # Firmware: host build + unit tests, KLEE proofs, bounded fuzz
  # runs. The ngspice subcircuit benches are the `sim` matrix below.
  firmware:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      # Sparse checkout: only this gate's declared inputs are present
      # (see the pytest job for the rationale). scripts/ whole:
      # meson setup find_program/files()s every runner script, even
      # the ones this job never runs.
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            flake.nix
            flake.lock
            nix/**
            meson.build
            meson.options
            meson/**
            design/__init__.py
            design/node_pins.py
            src/**
            firmware/**
            scripts/**

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v16
        with:
          name: oparroy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: |
          nix develop -c meson setup build/host --native-file meson/native/clang.ini
          nix develop -c ninja -C build/host
          nix develop -c meson test -C build/host --print-errorlogs
          nix develop -c ninja -C build/host klee-proofs fuzz

  # Subcircuit simulation benches (circuits/**/tb_*.cir, DESIGN.md
  # §7) — the firmware-side wall-clock long pole by far, so one job
  # per bench. The legs mirror the sim-* run_targets in
  # circuits/meson.build; keep the two lists in sync. fail-fast off
  # so one failing bench doesn't hide the others' results.
  sim:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.sim == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bench:
          - watchdog-chargepump-tb_engage
          - watchdog-chargepump-tb_missed_pulse
          - watchdog-chargepump-tb_glitch
          - watchdog-supervisor-tb_engage
          - watchdog-supervisor-tb_missed_pulse
          - watchdog-supervisor-tb_glitch
          - phy-segment-tb_decode
          - phy-segment-tb_noise
          - phy-segment-tb_fault
          - cable-reach-tb_reach
          - cable-reach-tb_redriver
          - cable-reach-tb_reach_noise
    steps:
      # Sparse checkout: only this gate's declared inputs are present
      # (see the pytest job for the rationale). scripts/ whole:
      # meson setup find_program/files()s every runner script. The
      # bare 'meson.build' pattern is recursive on purpose — setup
      # parses every subdir meson.build (circuits/, firmware/*/).
      # firmware/** and the bare (recursive) 'meson.build' pattern:
      # setup walks every subdir and checks its sources exist, even
      # for a sim-only run.
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            flake.nix
            flake.lock
            nix/**
            meson.build
            meson.options
            meson/**
            circuits/**
            firmware/**
            scripts/**

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v16
        with:
          name: oparroy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: |
          nix develop -c meson setup build/host --native-file meson/native/clang.ini
          nix develop -c ninja -C build/host sim-${{ matrix.bench }}

  # Firmware rv32ec cross build.
  rv32ec:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rv32ec == 'true'
    runs-on: ubuntu-latest
    steps:
      # Sparse checkout: only this gate's declared inputs are present
      # (see the pytest job for the rationale). scripts/ whole: the
      # root meson.build find_programs the runner scripts even in
      # cross builds. The bare 'meson.build' pattern is recursive on
      # purpose — setup parses every subdir meson.build (circuits/).
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            flake.nix
            flake.lock
            nix/**
            meson.build
            meson.options
            meson/**
            design/__init__.py
            design/node_pins.py
            src/**
            firmware/**
            scripts/**

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v16
        with:
          name: oparroy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: |
          nix develop -c meson setup build/rv32ec --cross-file meson/cross/rv32ec.ini
          nix develop -c ninja -C build/rv32ec

  # Reproducibility gate (DESIGN.md §8): builds every configuration
  # twice at different absolute paths and compares artifact hashes.
  # The script makes its own fresh build dirs; the configured
  # build/host exists only because the gate is wired as a run_target.
  reproducibility:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.reproducibility == 'true'
    runs-on: ubuntu-latest
    steps:
      # Sparse checkout: only this gate's declared inputs are present
      # (see the pytest job for the rationale). scripts/ whole:
      # meson setup find_program/files()s every runner script. The
      # bare 'meson.build' pattern is recursive on purpose — setup
      # parses every subdir meson.build (circuits/, firmware/*/).
      - uses: actions/checkout@v5
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            flake.nix
            flake.lock
            nix/**
            meson.build
            meson.options
            meson/**
            design/__init__.py
            design/node_pins.py
            src/**
            firmware/**
            scripts/**

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v16
        with:
          name: oparroy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: |
          nix develop -c meson setup build/host --native-file meson/native/clang.ini
          nix develop -c ninja -C build/host check-reproducible

  # Same hooks as local pre-commit (language: system → the nix
  # shell supplies every binary): ruff, ty, clang-format,
  # clang-tidy, mdformat, markdownlint, lychee.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v16
        with:
          name: oparroy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # lychee's link-check cache (.lychee.toml): only verified-good URLs
      # are stored, so a warm cache keeps transient remote errors from
      # failing links a PR never touched. PRs restore main's cache via
      # restore-keys; lychee discards entries older than max_cache_age.
      - uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ github.ref }}
          restore-keys: lychee-${{ runner.os }}-

      # GITHUB_TOKEN: lychee checks github.com links via the REST API
      # instead of unauthenticated HTML hits (rate-limit/load-shed flakes).
      - run: nix develop -c pre-commit run --all-files --show-diff-on-failure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Aggregate the parallel gates into the single required context
  # branch protection and Mergify key on. if: always() so a failed
  # need (which skips dependents by default) still turns this red —
  # including the `changes` job itself. A gate skipped by its input
  # filter reports 'skipped', which the condition below treats as
  # green; only failure and cancelled turn the aggregate red.
  check:
    if: always()
    needs: [changes, pytest, firmware, sim, rv32ec, reproducibility, lint]
    runs-on: ubuntu-latest
    steps:
      - name: aggregate gate results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
