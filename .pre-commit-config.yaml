# Pre-commit hooks: cheap checks only, <3s warm (T16b).
#
# All project tools come from the nix dev shell (flake.nix, DESIGN.md §8),
# so project hooks are `language: system`/`script` wrappers around
# nix-pinned binaries — pre-commit downloads nothing but the generic
# hygiene hooks below. Run inside `nix develop` (direnv does this).
# Setup: pre-commit install

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
      exclude: '^\.clang-format$|^\.clang-tidy$'
    - id: check-added-large-files
      args: ['--maxkb=512']

- repo: local
  hooks:
    - id: clang-format
      name: clang-format
      entry: clang-format -i
      language: system
      types_or: [c++, c]

    - id: clang-tidy
      name: clang-tidy (host compile_commands.json)
      entry: scripts/pre-commit/clang-tidy-changed
      language: script
      files: ^firmware/
      types_or: [c++, c]

    # Markdown pipeline as in falcon-app (PR #11194): mdformat owns GFM
    # layout, markdownlint lints content, lychee checks links/anchors.
    - id: mdformat
      name: mdformat (GFM)
      entry: mdformat
      language: system
      types: [markdown]

    - id: markdownlint-cli2
      name: markdownlint-cli2
      entry: markdownlint-cli2
      language: system
      types: [markdown]

    - id: lychee
      name: lychee link check
      entry: lychee --config .lychee.toml --no-progress
      language: system
      types: [markdown]
