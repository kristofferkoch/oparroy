# Pre-commit hooks: cheap checks only, <3s warm.
#
# Non-Python tools come from the nix dev shell (flake.nix, DESIGN.md §8);
# Python tools (ruff, ty) come from the uv project (pyproject.toml), with
# uv itself nix-pinned. Project hooks are `language: system`/`script`
# wrappers around those binaries — pre-commit downloads nothing but the
# generic hygiene hooks below. Run inside `nix develop` (direnv does this).
# Setup: pre-commit install

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
      exclude: '^\.clang-format$|^\.clang-tidy$'
    - id: check-added-large-files
      args: ['--maxkb=512']
      exclude: '^datasheets/'

- repo: local
  hooks:
    - id: clang-format
      name: clang-format
      entry: clang-format -i
      language: system
      types_or: [c++, c]

    - id: clang-tidy
      name: clang-tidy (host compile_commands.json)
      entry: scripts/pre-commit/clang-tidy-changed
      language: script
      files: ^firmware/
      types_or: [c++, c]

    # Python side: ruff and ty via uv (pyproject.toml owns the versions).
    # pytest stays out of pre-commit — hooks are cheap checks only.
    - id: ruff-check
      name: ruff check
      entry: uv run --frozen ruff check --force-exclude
      language: system
      types: [python]

    - id: ruff-format
      name: ruff format
      entry: uv run --frozen ruff format --force-exclude
      language: system
      types: [python]

    - id: ty
      name: ty type check
      entry: uv run --frozen ty check
      language: system
      types: [python]
      pass_filenames: false

    # KANBAN card IDs (T##) never leave KANBAN.md (AGENTS.md): cards are
    # deleted as they ship, orphaning every outside citation. Two digits
    # minimum — single-digit tokens are tile instance names ("T0"), spice
    # transmission-line elements, MCU timers, and datasheet tables (T3-16).
    - id: no-kanban-card-ids
      name: no KANBAN card IDs outside KANBAN.md
      entry: '\bT[0-9]{2}[a-z]?\b'
      language: pygrep
      types: [text]
      exclude: '^KANBAN\.md$'

    # Markdown pipeline as in falcon-app (PR #11194): mdformat owns GFM
    # layout, markdownlint lints content, lychee checks links/anchors.
    - id: mdformat
      name: mdformat (GFM)
      entry: mdformat
      language: system
      types: [markdown]

    - id: markdownlint-cli2
      name: markdownlint-cli2
      entry: markdownlint-cli2
      language: system
      types: [markdown]

    - id: lychee
      name: lychee link check
      entry: lychee --config .lychee.toml --no-progress
      language: system
      types: [markdown]
