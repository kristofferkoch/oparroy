# CH32V003 node toolchain (DESIGN.md §5): RV32EC, ilp32e ABI.
[binaries]
cpp = 'riscv64-none-elf-g++'
ar = 'riscv64-none-elf-ar'

[host_machine]
system = 'bare-metal'
cpu_family = 'riscv32'
cpu = 'rv32ec'
endian = 'little'

[properties]
# No way to run target binaries; meson's compiler sanity check is
# compile-only (a link would fail — freestanding has no crt0).
needs_exe_wrapper = true

[built-in options]
# OPARROY_TARGET routes VERIFY to the platform failure hook
# (lib::verify_failed, firmware/lib/verify.hpp) — the §4 watchdog
# wiring point; the node firmware defines the hook at link time (T11).
cpp_args = ['-march=rv32ec', '-mabi=ilp32e', '-DOPARROY_TARGET']
# No cpp_link_args: this toolchain ships no rv32ec/ilp32e multilib, so
# driving gcc as a linker with -march fails ("no suitable multilib set")
# and meson's linker detection dies. Builds here are compile/archive
# only; real .elf linking (custom linker script, -nostdlib, libgcc
# question) is deferred until the first target link (node firmware).
