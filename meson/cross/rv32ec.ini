# CH32V003 node toolchain (DESIGN.md §5): RV32EC, ilp32e ABI.
[binaries]
cpp = 'riscv64-none-elf-g++'
ar = 'riscv64-none-elf-ar'

[host_machine]
system = 'bare-metal'
cpu_family = 'riscv32'
cpu = 'rv32ec'
endian = 'little'

[properties]
# No way to run target binaries; meson's compiler sanity check is
# compile-only (a link would fail — freestanding has no crt0).
needs_exe_wrapper = true

[built-in options]
# OPARROY_TARGET routes VERIFY to the platform failure hook
# (lib::verify_failed, firmware/lib/verify.hpp) — the §4 watchdog
# wiring point; the node firmware defines the hook at link time.
# rv32ec_zicsr: gcc ≥ 11 splits CSR instructions out of the base arch
# into Zicsr; the QingKe V2A implements them (PM §7), so the real arch
# string for the silicon is rv32ec_zicsr, not the marketing "RV32EC".
cpp_args = ['-march=rv32ec_zicsr', '-mabi=ilp32e', '-DOPARROY_TARGET']
# No cpp_link_args: per-target link args only, so meson's compiler
# sanity check keeps linking a trivial hosted binary without project
# flags. The node.elf target (firmware/node/meson.build) links through
# the gcc driver with -nostdlib -nostartfiles — that path never
# requests crt0 or libgcc, so the toolchain's missing rv32ec/ilp32e
# multilib probe never fires, and firmware/node/runtime.cpp covers the
# multiply/divide libcalls libgcc would have owned.
