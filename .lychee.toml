# Link checking for markdown (pre-commit). Local links/anchors and
# public URLs are checked; auth-gated, bot-blocking, or flaky URLs get
# excluded here as they appear (same role as falcon-app's .lychee.toml).
exclude = [
  # 403 to non-browser clients (bot filter), fine in a browser.
  '^https?://(www\.)?eevblog\.com/',
  # 403 from GitHub Actions IPs (Cloudflare bot filter), 200 locally.
  '^https?://(www\.)?silabs\.com/',
  # Times out from CI and locally (site outage, 2026-09-30).
  '^https?://(www\.)?beagleboard\.org/',
]
include_fragments = 'anchor-only'
max_concurrency = 12
max_retries = 1
timeout = 10
